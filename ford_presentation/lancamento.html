<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FordEnter</title>
    <link rel="stylesheet" href="../styles/lancamento.css">
    <link rel="icon" type="image/png" href="../img/ford-96.png">
    <script src="js/compare.js"></script>
</head>
<body>
    <header>    
        <div class="menu-bar">
            <span><img src="../img/logo-ford-256.png" alt="Logo Ford"></span>
            <nav class="menu">
                <ul>
                    <a href="homePage.html">Home</a>
                    <a href="lancamento.html">Lançamento</a>
                    <a href="contato.html">Contato</a>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/vQsryuNmsL0?autoplay=1&mute=1&loop=1&playlist=vQsryuNmsL0"
                title="Ford Ranger" 
                frameborder="0" 
                allow="accelerometer; autoplay" 
                allowfullscreen>
            </iframe>
            <p>Veja o novo Ford Ranger 2022 em ação!</p>
        </div>

        <table class="products-table">
            <tr>
                <td>
                    <div class="product-card">
                        <img src="../img/XL Cabine.jpg" alt="produto1" class="product-image">
                        <div class="product-content">
                            <div class="checkbox-text-wrapper">
                                <input type="checkbox" value="car1" class="checkbox" onchange="SetCarToCompare(this, new Car('XL Cabine Simples 2.2 Diesel 4X4 MT 2022', 183850, 511, 1821, 232, 1234, 2.2, 160, 1420, 'Aço Estampado 16', 'img/XL Cabine.jpg'));">
                                <label for="comparar-1">
                                    <div class="text-info">
                                        <h2 class="product-title">XL Cabine Simples 2.2 Diesel 4X4 MT 2022</h2>
                                        <p class="product-description">Preço Sugerido: R$ 183.850</p>
                                    </div>
                                </label>
                            </div>
                            <img src="../img/info.png" alt="Informacoes" class="info-icon">
                        </div>
                    </div>
                </td>

                <td>
                    <div class="product-card">
                        <img src="../img/xls 2.2 diesel.jpg" alt="produto2" class="product-image">
                        <div class="product-content">
                            <div class="checkbox-text-wrapper">
                                <input type="checkbox" value="car1" class="checkbox" onchange="SetCarToCompare(this, new Car('XLS 2.2 Diesel 4X4 AT 2022', 220690, 511, 1821, 232, 1076, 2.2, 160, 1180, 'Aço Estampado 16', 'img/xls 2.2 diesel.jpg'));">
                                <label for="comparar-2">
                                    <div class="text-info">
                                        <h2 class="product-title">XLS 2.2 Diesel 4X4 AT 2022</h2>
                                        <p class="product-description">Preço Sugerido: R$ 220.690</p>
                                    </div>
                                </label>
                            </div>
                            <img src="../img/info.png" alt="Informacoes" class="info-icon">
                        </div>
                    </div>
                </td>

                <td>
                    <div class="product-card">
                        <img src="../img/storm.jpg" alt="produto3" class="product-image">
                        <div class="product-content">
                            <div class="checkbox-text-wrapper">
                                <input type="checkbox" value="car1" class="checkbox" onchange="SetCarToCompare(this, new Car('Storm 3.2 Diesel 4X4 AT 2022', 222790, 511, 1821, 232, 1040, 3.2, 200, 1180, 'Liga Leve 17', 'img/storm.jpg'));">
                                <label for="comparar-3">
                                    <div class="text-info">
                                        <h2 class="product-title">Storm 3.2 Diesel 4X4 AT 2022</h2>
                                        <p class="product-description">Preço Sugerido: R$ 222.790</p>
                                    </div>
                                </label>
                            </div>
                            <img src="../img/info.png" alt="Informacoes" class="info-icon">
                        </div>
                    </div>
                </td>
            </tr>
        </table>

        <div class ="compare-button">
            <button type="button" onclick="ShowCompare()">Comparar Carros</button>
        </div> 
    </main>
    <footer>
        <div class="social-media">
            
            <nav>
                <ul>
                    <p>Redes Sociais:</p>
                    <a href="https://www.facebook.com/FordBrasil/" target="_blank"><img src="../img/facebook-50.png" alt="Facebook"></a>
                    <a href="https://www.youtube.com/@ford" target="_blank"><img src="../img/youtube-squared-50.png" alt="Youtube"></a>
                    <a href="https://www.instagram.com/ford/" target="_blank"><img src="../img/instagram-logo-50.png" alt="Instagram"></a>
                </ul>
            </nav>
        </div>
        <div class="copyright">
            <p>© 2026 Ford Brasil Ltda. Todos os direitos reservados.</p>
        </div>
        <div class="logo-footer">
            <img src="../img/ford-96.png" alt="Logo Ford">
        </div>
    </footer>
    <div id="compare">
        <table>
            <tbody>
            <tr >
            <td>&nbsp;</td>
            <td id="compare_image_0"></td>
            <td id="compare_image_1"></td>
            </tr>
            <tr >
            <td>Modelo</td>
            <td id="compare_modelo_0"></td>
            <td id="compare_modelo_1"></td>
            </tr>
            <tr >
            <td>Altura da ca&ccedil;amba (mm)</td>
            <td id="compare_alturacacamba_0"></td>
            <td id="compare_alturacacamba_1"></td>
            </tr>
            <tr >
            <td >Altura do ve&iacute;culo (mm)</td>
            <td id="compare_alturaveiculo_0"></td>
            <td id="compare_alturaveiculo_1"></td>
            </tr>
            <tr>
            <td>Altura livre do solo (mm)</td>
            <td id="compare_alturasolo_0"></td>
            <td id="compare_alturasolo_1"></td>
            </tr>
            <tr >
            <td >Capacidade de carga (Kg)</td>
            <td id="compare_capacidadecarga_0"></td>
            <td id="compare_capacidadecarga_1"></td>
            </tr>
            <tr >
            <td >Motor</td>
            <td id="compare_motor_0"></td>
            <td id="compare_motor_1"></td>
            </tr>
            <tr >
            <td >Pot&ecirc;ncia (cv)</td>
            <td id="compare_potencia_0"></td>
            <td id="compare_potencia_1"></td>
            </tr>
            <tr >
            <td >Volume de ca&ccedil;amba (L)</td>
            <td id="compare_volumecacamba_0"></td>
            <td id="compare_volumecacamba_1"></td>
            </tr>
            <tr >
            <td >Roda</td>
            <td id="compare_roda_0"></td>
            <td id="compare_roda_1"></td>
            </tr>
            <tr >
            <td >Pre&ccedil;o</td>
            <td id="compare_preco_0"></td>
            <td id="compare_preco_1"></td>
            </tr>
            </tbody>
            
        </table>
        <div style="text-align: center;padding-bottom: 20px;">
            <button type="button" style="height: 40px; width: 200px;" onclick="HideCompare()">Fechar</button>
        </div> 
    </div>   
</body>
</html>
